#
# #14758 back-fill of the envelope root key into an EXISTING SLM secrets file.
# A fresh install gets the key from the slm-secrets.env template; every host
# provisioned before #14758 already has the file, so the template is skipped
# and only this back-fill can add the key.
#
# #19051: it lives in its own file so update-all-nodes.yml Play 1 -- the builtin
# updater, which deploys by unarchive and never runs this role -- includes the
# SAME tasks. While the back-fill sat only in main.yml, a host kept current by
# the updater alone never received a key: the backend rendered
# `AUTOBOT_SECRETS_ROOT_KEY=` and every System vault call returned 503.
#
# Gated on the grep finding nothing, so it only ever ADDS. Rotating this value
# silently would be worse than leaving it absent: the root key derives every
# vault KEK, so a new one makes every already-encrypted secret undecryptable.
- name: "SLM | Stat the secrets file for the root-key back-fill (#19051)"
  ansible.builtin.stat:
    path: "{{ slm_credentials_dir }}/{{ slm_credentials_file }}"
  register: _slm_root_key_file
  become: true
  tags: ['slm', 'secrets']

- name: "SLM | Check if AUTOBOT_SECRETS_ROOT_KEY present in secrets file (#14758)"
  ansible.builtin.shell:
    cmd: >-
      grep -q '^AUTOBOT_SECRETS_ROOT_KEY=.\+'
      {{ slm_credentials_dir }}/{{ slm_credentials_file }}
  register: _slm_root_key_check
  changed_when: false
  failed_when: false
  when: _slm_root_key_file.stat.exists
  become: true
  no_log: true
  tags: ['slm', 'secrets']

- name: "SLM | Add AUTOBOT_SECRETS_ROOT_KEY to existing secrets file (#14758)"
  ansible.builtin.lineinfile:
    path: "{{ slm_credentials_dir }}/{{ slm_credentials_file }}"
    regexp: "^AUTOBOT_SECRETS_ROOT_KEY="
    # #16405: 32 random bytes from openssl rand, not 32 characters from a
    # password lookup.
    line: "AUTOBOT_SECRETS_ROOT_KEY={{ lookup('pipe', 'openssl rand -base64 32') | replace('+', '-') | replace('/', '_') }}"
    create: false
  when:
    - _slm_root_key_file.stat.exists
    - _slm_root_key_check.rc != 0
  become: true
  no_log: true
  tags: ['slm', 'secrets']
