# Python Provision Permissions Playbook (#11343)
# Grants the autobot service user a narrowly-scoped NOPASSWD sudoers entry so
# the SLM code-sync update path can install the target Python interpreter
# (python3.14 fleet-wide, including the NPU worker since #13747) when it is
# missing, by running
# ONLY the provision-local-python.yml playbook via ansible-playbook.
#
# Mirrors configure-redis-service-management.yml: validated with visudo,
# written 0440 root:root, applied once during provisioning.
#
# The grant is scoped to the exact ansible-playbook invocation that the
# backend issues (services/api/code_sync.py::_ensure_target_python_installed).
# The role itself performs the apt/add-apt-repository work under root — running
# the whole ansible-playbook as root keeps the sudoers surface to ONE command
# instead of a blanket apt/add-apt-repository grant.
#
# #13843: the role was renamed roles/python314 -> roles/python_interpreter, but
# `--tags python314` below is UNCHANGED on purpose. Sudoers matches the
# generated command literally, so a node whose sudoers entry already exists
# (generated by an earlier run of this playbook) only recognises the OLD tag
# until this playbook is re-applied there. Rather than require that
# coordinated re-run, `python314` stays a permanent alias tag on every task in
# roles/python_interpreter (see that role's tasks/main.yml), so this exact,
# already-deployed grant keeps working indefinitely.

- name: "Configure Python Provision Permissions"
  hosts: slm_server
  become: true
  gather_facts: true

  vars:
    sudoers_file: "/etc/sudoers.d/autobot-python-provision"
    autobot_user: "autobot"
    # Absolute paths the backend passes to sudo ansible-playbook. Sudoers
    # matches the command literally, so these MUST equal the argv the backend
    # builds in _ensure_target_python_installed.
    ansible_playbook_bin: "/usr/bin/ansible-playbook"
    # The backend argv is `sudo ansible-playbook <_PROVISION_PYTHON_PLAYBOOK>`
    # (api/code_sync.py), rooted at `DEFAULT_REPO_PATH` (services/git_tracker.py):
    # `SLM_REPO_PATH` when the backend's environment sets it, else its fallback.
    # Sudoers exact-matches that argv, so this value follows the same two steps:
    # the fallback below is spelled through `autobot.base_dir` (#18881) and
    # repo_tests/provision_playbook_path_agrees_15707_test.py proves it renders
    # byte-identical to the Python fallback; the pre_tasks then re-root it at the
    # running backend's own `SLM_REPO_PATH` when one is set, so an override moves
    # both sides together instead of leaving sudo refusing the command.
    provision_playbook: "{{ autobot.base_dir }}/code_source/autobot-slm-backend/ansible/playbooks/provision-local-python.yml"
    slm_backend_service: "autobot-slm-backend"

  pre_tasks:
    # The process environment, not the unit file: SLM_REPO_PATH can arrive through
    # Environment= or any EnvironmentFile=, and /proc/<pid>/environ holds what the
    # backend's os.environ started with. No running backend leaves the fallback.
    - name: Read the running SLM backend's environment
      ansible.builtin.shell: |
        set -o pipefail
        pid=$(systemctl show {{ slm_backend_service }}.service --property=MainPID --value)
        if [ "${pid:-0}" -gt 0 ]; then tr '\0' '\n' < "/proc/${pid}/environ"; fi
      args:
        executable: /bin/bash
      register: slm_backend_environ
      changed_when: false

    - name: Root the provision playbook at the backend's SLM_REPO_PATH override
      ansible.builtin.set_fact:
        provision_playbook: "{{ slm_repo_path_override }}/autobot-slm-backend/ansible/playbooks/provision-local-python.yml"
      vars:
        slm_repo_path_override: "{{ slm_backend_environ.stdout_lines | select('match', '^SLM_REPO_PATH=') | map('regex_replace', '^SLM_REPO_PATH=', '') | map('regex_replace', '/+$', '') | first | default('') }}"
      when: slm_repo_path_override | length > 0

    - name: Display configuration information
      ansible.builtin.debug:
        msg:
          - "Configuring Python Provision Permissions"
          - "Host: {{ inventory_hostname }}"
          - "User: {{ autobot_user }}"
          - "Sudoers file: {{ sudoers_file }}"
          - "Playbook: {{ provision_playbook }}"

  tasks:
    - name: Verify autobot user exists
      ansible.builtin.command: id {{ autobot_user }}
      register: user_check
      failed_when: user_check.rc != 0
      changed_when: false

    - name: Create Python provision sudoers configuration
      ansible.builtin.copy:
        content: |
          # AutoBot Python Provision (#11343)
          # Allows the autobot user to install the target Python interpreter via
          # the provision-local-python.yml playbook without a password. Scoped to
          # the EXACT ansible-playbook invocation the SLM backend issues.
          # Created by: Ansible playbook configure-python-provision-permissions.yml
          # Date: {{ ansible_facts['date_time'].iso8601 }}

          {{ autobot_user }} ALL=(root) NOPASSWD: {{ ansible_playbook_bin }} {{ provision_playbook }} --tags python314 -i localhost, --connection local
        dest: "{{ sudoers_file }}.tmp"
        owner: root
        group: root
        mode: '0440'

    - name: Validate sudoers file syntax
      ansible.builtin.command: visudo -cf {{ sudoers_file }}.tmp
      register: visudo_check
      changed_when: false

    - name: Move validated sudoers file to final location
      ansible.builtin.command: mv {{ sudoers_file }}.tmp {{ sudoers_file }}
      when: visudo_check.rc == 0
      changed_when: true

    - name: Ensure sudoers file has correct permissions
      ansible.builtin.file:
        path: "{{ sudoers_file }}"
        owner: root
        group: root
        mode: '0440'
        state: file

  post_tasks:
    - name: Display configuration summary
      ansible.builtin.debug:
        msg:
          - "Python Provision Permissions Configuration Complete"
          - "Sudoers file: {{ sudoers_file }}"
          - "User: {{ autobot_user }}"
          - "The autobot user can now run the interpreter provisioning playbook:"
          - "  sudo {{ ansible_playbook_bin }} {{ provision_playbook }} --tags python314 -i localhost, --connection local"
