#
# Dispatch the generated-types autofix on a branch (#18500). A merge train runs this on
# its train branch to learn, from one job, whether the combined tree needs an api.ts
# patch -- instead of spending a full CI suite on the train PR. On drift the job fails
# and uploads the `generated-types-patch` artifact, exactly as on a pull request.
#
# A workflow of its own, not a second trigger on auto-fix-generated-types.yml: see
# _generated-types-autofix.yml for why (CodeQL cache-poisoning on a shared PR checkout).

name: Dispatch Generated Types Autofix

on:
  workflow_dispatch:

# One run per dispatched branch; a newer dispatch on the same branch supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix-types:
    uses: ./.github/workflows/_generated-types-autofix.yml
    with:
      ref: ${{ github.ref }}
    # Only the checkout token, not every repository secret.
    secrets:
      AUTOBOT_PUSH_TOKEN: ${{ secrets.AUTOBOT_PUSH_TOKEN }}
